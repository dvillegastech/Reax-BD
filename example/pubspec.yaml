name: reaxdb_example
description: "A Flutter showcase of the ReaxDB 2.0 API, one screen per feature."
# Prevents the example from being accidentally published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The database this example demonstrates.
  reaxdb_dart:
    path: ../

  # Where the example stores its databases.
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
